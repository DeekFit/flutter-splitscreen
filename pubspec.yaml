name: split_screen
description: Foldable and dual-screen support, like the TwoPane widget and hinge angle sensor data. Forked from the Microsoft dual_screen package.
version: 2.0.0-dev.1
homepage: https://docs.microsoft.com/en-us/dual-screen/
repository: https://github.com/DeekFit/flutter-splitscreen

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.microsoft.flutterdualscreen
        pluginClass: DualScreenInfo
      ios:
        pluginClass: SplitScreenPlugin
