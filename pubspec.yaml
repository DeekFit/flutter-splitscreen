name: split_screen
description: Adaptive two-pane layouts and hinge-angle readings for Android foldables and iPhone Duo, with automatic division alignment and phone, tablet, desktop, and web layouts.
version: 2.0.0
homepage: https://github.com/DeekFit/flutter-splitscreen
repository: https://github.com/DeekFit/flutter-splitscreen

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.microsoft.flutterdualscreen
        pluginClass: DualScreenInfo
      ios:
        pluginClass: SplitScreenPlugin
